[package]
name = "cube6"
version = "0.1.0"
edition = "2021"

[features]
# 5x5x5 board instead of 6x6x6 (src/bits.rs SIDE)
n5 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
dashmap = "6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
